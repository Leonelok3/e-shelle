<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Filtre néon rétroéclairé (Backlit Halo Glow) -->
    <filter id="africa-backlight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Filtre de lueur interne orange pour OCD -->
    <filter id="ocd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Dégradé lumineux pour le contour d'Afrique -->
    <linearGradient id="glow-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFB300" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FF8F00" stop-opacity="0.8" />
    </linearGradient>

    <!-- Dégradé Signature Orange OCD -->
    <linearGradient id="ocd-orange-grad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#D84300" />
    </linearGradient>

    <!-- Ombre portée pour les lettres 3D -->
    <filter id="letter-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Arrière-plan transparent ou sombre -->
  <g id="ocd-live-full-logo">
    <!-- Halo néon doré derrière la carte d'Afrique -->
    <path d="M 330 45
             C 380 40, 460 38, 515 85
             C 545 110, 560 135, 595 170
             C 615 190, 680 230, 725 285
             C 745 310, 715 325, 685 330
             C 655 335, 615 330, 590 350
             C 570 370, 575 410, 560 455
             C 540 510, 500 580, 455 615
             C 435 630, 415 620, 405 580
             C 390 535, 370 480, 360 445
             C 350 420, 320 395, 290 380
             C 255 365, 215 350, 185 320
             C 150 285, 120 235, 125 185
             C 130 140, 175 105, 220 85
             C 260 65, 295 50, 330 45 Z"
          fill="none"
          stroke="url(#glow-gold)"
          stroke-width="22"
          filter="url(#africa-backlight)" />

    <!-- Carte d'Afrique en relief 3D (panneau blanc/ivoire pur comme sur le mur) -->
    <path d="M 330 45
             C 380 40, 460 38, 515 85
             C 545 110, 560 135, 595 170
             C 615 190, 680 230, 725 285
             C 745 310, 715 325, 685 330
             C 655 335, 615 330, 590 350
             C 570 370, 575 410, 560 455
             C 540 510, 500 580, 455 615
             C 435 630, 415 620, 405 580
             C 390 535, 370 480, 360 445
             C 350 420, 320 395, 290 380
             C 255 365, 215 350, 185 320
             C 150 285, 120 235, 125 185
             C 130 140, 175 105, 220 85
             C 260 65, 295 50, 330 45 Z"
          fill="#F8FAFC"
          stroke="#FFFFFF"
          stroke-width="4"
          filter="url(#letter-shadow)" />

    <!-- Île de Madagascar -->
    <path d="M 660 450
             C 680 470, 675 540, 645 565
             C 630 575, 620 550, 630 510
             C 640 475, 645 440, 660 450 Z"
          fill="#F8FAFC"
          stroke="url(#glow-gold)"
          stroke-width="5"
          filter="url(#africa-backlight)" />

    <!-- LOGO CENTRÉ OCD (Ruban Infini Stylisé Orange Métallique 3D) -->
    <g transform="translate(235, 175)" filter="url(#letter-shadow)">
      <!-- Lettre 'O' -->
      <path d="M 65 95
               C 28 95, 0 68, 0 35
               C 0 10, 22 -15, 60 -15
               C 98 -15, 125 15, 125 45
               C 125 75, 95 95, 65 95 Z
               M 62 70
               C 80 70, 95 55, 95 38
               C 95 20, 80 8, 62 8
               C 44 8, 30 22, 30 40
               C 30 58, 44 70, 62 70 Z"
            fill="url(#ocd-orange-grad)" />

      <!-- Lettre 'C' connectée -->
      <path d="M 125 75
               C 145 92, 175 98, 205 92
               C 225 88, 240 76, 252 62
               L 230 44
               C 220 54, 210 65, 195 68
               C 175 72, 155 65, 142 50
               C 130 35, 134 15, 148 0
               C 160 -12, 185 -18, 208 -12
               C 225 -8, 238 2, 248 14
               L 270 -4
               C 252 -22, 230 -35, 198 -35
               C 155 -35, 120 -10, 105 25
               C 98 42, 108 62, 125 75 Z"
            fill="url(#ocd-orange-grad)" />

      <!-- Lettre 'D' avec boucle continue -->
      <path d="M 230 95
               L 260 95
               L 260 65
               C 285 92, 318 98, 348 92
               C 390 82, 415 45, 415 15
               C 415 -25, 380 -55, 335 -55
               L 230 -55
               L 230 95 Z
               M 260 -28
               L 330 -28
               C 360 -28, 382 -10, 382 15
               C 382 42, 360 65, 328 65
               C 300 65, 275 50, 260 30
               L 260 -28 Z"
            fill="url(#ocd-orange-grad)" />
    </g>

    <!-- TYPOGRAPHIE "Live" EN NOIR PROFOND MODERNE -->
    <g transform="translate(380, 325)" filter="url(#letter-shadow)">
      <!-- Texte 'Live' -->
      <text x="0" y="0"
            font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', sans-serif"
            font-size="78"
            font-weight="900"
            letter-spacing="-1.5px"
            fill="#0F172A">
        Live
      </text>

      <!-- Badge Point Rouge LIVE avec lueur d'activité -->
      <circle cx="165" cy="-24" r="10" fill="#EF4444" />
      <circle cx="165" cy="-24" r="16" fill="none" stroke="#EF4444" stroke-width="2.5" opacity="0.6">
        <animate attributeName="r" values="10;22;10" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>
</svg>

