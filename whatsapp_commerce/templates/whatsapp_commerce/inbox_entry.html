<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Inbox WhatsApp Business | E-Shelle</title>
	<style>
		body { background: #080d0b; color: #f4f7f5; font: 16px/1.5 system-ui, sans-serif; margin: 0; }
		main { margin: 4rem auto; max-width: 48rem; padding: 0 1rem; }
		li { align-items: center; background: #111a16; border: 1px solid #26372e; border-radius: .75rem; display: flex; justify-content: space-between; margin: .75rem 0; padding: 1rem; }
		a { background: #198754; border-radius: .4rem; color: white; padding: .55rem .8rem; text-decoration: none; }
	</style>
</head>
<body>
	<main>
		<h1>Inbox WhatsApp Business</h1>
		<p>Choisissez une fiche Business pour ouvrir ses conversations WhatsApp.</p>
		{% if businesses %}
			<ul>
				{% for business in businesses %}
					<li>
						<span>{{ business.name }}</span>
						<a href="{% url 'whatsapp_commerce:business_dashboard' business.pk %}">Ouvrir l’inbox</a>
					</li>
				{% endfor %}
			</ul>
		{% else %}
			<p>Aucune fiche Business n’est associée à ce compte.</p>
		{% endif %}
	</main>
</body>
</html>
