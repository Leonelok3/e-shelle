{% if directory_cards|length >= 3 %}
  <section class="es-dir-preview es-home-section es-home-wrap" aria-labelledby="dir-preview-title">
    <div class="es-dir-preview-head">
      <h2 id="dir-preview-title">Restaurants inscrits</h2>
      <a class="es-home-text-link" href="{% url 'restaurant_landing' %}#annuaire">Voir tous les restaurants <span aria-hidden="true">→</span></a>
    </div>
    <div class="es-dir-grid">
      {% for card in directory_cards %}{% include "partials/es_dir/card.html" with card=card compact=True only %}{% endfor %}
    </div>
  </section>
{% endif %}
