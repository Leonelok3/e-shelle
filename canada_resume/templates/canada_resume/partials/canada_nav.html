<div style="background:#fff; border-bottom:2px solid #e2e8f0; margin-bottom:2rem; padding: 0.75rem 1.25rem; border-radius: 14px; box-shadow:0 4px 12px rgba(16,43,78,0.03); font-family:'Outfit',sans-serif;">
  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
    <div style="display:flex; align-items:center; gap:0.5rem;">
      <span style="font-size:1.3rem;">🍁</span>
      <strong style="color:#C8102E; font-size:1.05rem; text-transform:uppercase; letter-spacing:0.05em;">E-Shelle Canada</strong>
    </div>
    <div style="display:flex; gap:0.4rem; flex-wrap:wrap; align-items:center;">
      <a href="/" style="padding:0.45rem 0.9rem; font-size:0.82rem; font-weight:700; color:#475569; text-decoration:none; border-radius:8px; background:#f1f5f9; transition:background 0.2s;">🏠 Accueil</a>
      
      <a href="{% url 'canada_resume:dashboard' %}" 
         style="padding:0.45rem 0.9rem; font-size:0.82rem; font-weight:700; text-decoration:none; border-radius:8px; transition:all 0.2s; 
         {% if 'dashboard' in request.path or 'portfolio' in request.path %} background:#C8102E; color:#fff; {% else %} background:#FFF5F5; color:#C8102E; {% endif %}">
         📄 Mon CV & Portfolio
      </a>
      
      <a href="{% url 'jobs:canada_jobs' %}" 
         style="padding:0.45rem 0.9rem; font-size:0.82rem; font-weight:700; text-decoration:none; border-radius:8px; transition:all 0.2s;
         {% if 'canada' in request.path and 'bourses' not in request.path and 'visitor' not in request.path and 'actualites' not in request.path and 'talents' not in request.path and 'coach' not in request.path and 'simulation' not in request.path and 'portfolio' not in request.path and 'dashboard' not in request.path %} background:#102B4E; color:#fff; {% else %} background:#f0f4f8; color:#102B4E; {% endif %}">
         💼 Emplois
      </a>
      
      <a href="{% url 'canada_resume:talents_directory' %}" 
         style="padding:0.45rem 0.9rem; font-size:0.82rem; font-weight:700; text-decoration:none; border-radius:8px; transition:all 0.2s;
         {% if 'talents' in request.path %} background:#0f766e; color:#fff; {% else %} background:#f0fdfa; color:#0f766e; {% endif %}">
         👥 Annuaire Talents
      </a>
      
      <a href="{% url 'jobs:canada_news' %}" 
         style="padding:0.45rem 0.9rem; font-size:0.82rem; font-weight:700; text-decoration:none; border-radius:8px; transition:all 0.2s;
         {% if 'actualites' in request.path %} background:#b45309; color:#fff; {% else %} background:#fffbeb; color:#b45309; {% endif %}">
         📰 Actualités & Tirages
      </a>
      
      <a href="{% url 'canada_resume:immigration_coach' %}" 
         style="padding:0.45rem 0.9rem; font-size:0.82rem; font-weight:700; text-decoration:none; border-radius:8px; transition:all 0.2s;
         {% if 'immigration-coach' in request.path %} background:#6d28d9; color:#fff; {% else %} background:#faf5ff; color:#6d28d9; {% endif %}">
         🤖 Coach IA
      </a>
      
      <a href="{% url 'canada_resume:interview_simulation' %}" 
         style="padding:0.45rem 0.9rem; font-size:0.82rem; font-weight:700; text-decoration:none; border-radius:8px; transition:all 0.2s;
         {% if 'simulation-entretien' in request.path %} background:#4338ca; color:#fff; {% else %} background:#eef2ff; color:#4338ca; {% endif %}">
         🗣️ Entretien IA
      </a>
    </div>
  </div>
</div>
