{% if studio_usage %}
<section class="max-w-7xl mx-auto px-4 py-6" aria-label="Utilisation du forfait">
  <h2 class="font-bold text-lg mb-3">Votre utilisation sur les 30 derniers jours</h2>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
    {% for item in studio_usage %}
    <div class="rounded-xl border border-purple-100 bg-white p-4 text-gray-800">
      <strong class="text-xl">{{ item.used }} / {{ item.limit }}</strong>
      <p class="text-sm text-gray-600">{{ item.label }}</p>
    </div>
    {% endfor %}
  </div>
  <a class="inline-block mt-3 text-purple-700 underline" href="{% url 'adgen:studio_pricing' %}">Mon forfait et les abonnements</a>
</section>
{% endif %}
