<div class="hub-card">
  <form method="get" class="hub-staff-filters">
    {% for field in filter_form %}<div><label class="hub-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}
    <div><button class="hub-btn hub-btn-primary" type="submit">Filtrer</button> <a class="hub-btn hub-btn-secondary" href="{{ request.path }}">Effacer</a></div>
  </form>
  {% if filter_form.non_field_errors %}<div role="alert">{{ filter_form.non_field_errors }}</div>{% endif %}
  <p class="hub-muted">Les indicateurs et l’export correspondent aux filtres sélectionnés.</p>
</div>
