{% extends "base.html" %}

{% block title %}{{ course.title }} — {{ course.school.name }}{% endblock %}

{% block content %}
<div class="wrap" style="padding:2rem 1rem">
  <h1>{{ course.title }}</h1>
  <div style="color:#666">{{ course.school.name }}</div>
  <div style="margin-top:16px">{{ course.content|linebreaks }}</div>
</div>
{% endblock %}
