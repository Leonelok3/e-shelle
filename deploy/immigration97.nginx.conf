# Dedicated site. Review socket and paths against the LIVE E-Shelle config.
# Bootstrap with the HTTP block only; enable HTTPS after certificate issuance.
# Do not replace deploy/nginx.conf or the existing E-Shelle virtual host.
server {
    listen 80;
    listen [::]:80;
    server_name immigration97.com www.immigration97.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 302 https://immigration97.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.immigration97.com;
    ssl_certificate /etc/letsencrypt/live/immigration97.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immigration97.com/privkey.pem;
    return 302 https://immigration97.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name immigration97.com;
    ssl_certificate /etc/letsencrypt/live/immigration97.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/immigration97.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 55M;

    access_log /var/log/nginx/immigration97_access.log;
    error_log /var/log/nginx/immigration97_error.log;

    location /static/ {
        alias /home/eshelle/app/staticfiles/;
        expires 7d;
    }
    location /media/ {
        alias /home/eshelle/app/media/;
        expires 7d;
    }
    location ~ /\.(?!well-known) {
        deny all;
    }
    location / {
        proxy_pass http://unix:/run/eshelle/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
